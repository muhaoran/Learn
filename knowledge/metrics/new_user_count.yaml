metric_id: "new_user_count"
name: "新增用户数"
description: "某时间段内完成注册的去重用户数，以 register_date（注册日期）为统计口径"

pattern: "count_distinct"

pattern_params:
  entity: "user"
  filter_by: "registration"
  time_window: "register_date = ${target_date}"

aliases:
  - "新增用户数"
  - "新增用户"
  - "注册用户数"
  - "新用户数"
  - "新注册"
  - "New Users"

notes:
  - "以 register_date 分区字段为准，而非 register_time（避免跨日问题）"
  - "不包含注销后重新注册的用户（重新注册会生成新 user_id，会被计入）"

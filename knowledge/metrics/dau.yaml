metric_id: "dau"
name: "日活跃用户数"
description: "某自然日内有任意行为的去重用户数，统计口径以 dwd_user_behavior 为准（T+0 实时可查）"

pattern: "count_distinct"

pattern_params:
  entity: "user"
  event: "active_behavior"
  time_window: "date = ${target_date}"

aliases:
  - "DAU"
  - "日活"
  - "日活跃用户数"
  - "每天活跃用户"
  - "Daily Active User"

notes:
  - "时间范围是自然日（00:00-23:59），以行为发生时间为准"
  - "如果需要 T+1 数据（昨天的DAU），可以用 dws_user_daily（is_active=1），性能更好"
  - "当天实时数据有 5-10 分钟延迟"

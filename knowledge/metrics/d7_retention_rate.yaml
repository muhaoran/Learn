metric_id: "d7_retention_rate"
name: "新用户7日留存率"
description: "某日新增用户中，在第7天（注册后第7天）仍然活跃的用户占比"

pattern: "cohort_retention"

pattern_params:
  entity: "user"
  cohort_event: "registration"
  retain_event: "active_behavior"
  cohort_date: "register_date = ${base_date}"
  offset_days: 7

aliases:
  - "7日留存"
  - "7日留存率"
  - "D7留存"
  - "D7留存率"
  - "七日留存"
  - "Day 7 Retention"

notes:
  - "需要等到第7天结束后才能得到完整数据"
  - "与 D1 留存对比，可判断产品的中期留存能力"

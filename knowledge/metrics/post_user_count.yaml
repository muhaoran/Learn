metric_id: "post_user_count"
name: "发帖用户数"
description: "某时间段内有发帖行为的去重用户数"

pattern: "count_distinct"

pattern_params:
  entity: "user"
  event: "post_publish"
  time_window: "date = ${target_date}"

aliases:
  - "发帖用户数"
  - "发帖用户"
  - "发帖人数"
  - "有发帖的用户"

notes:
  - "发帖定义：behavior_type = 'create_post'，不含评论"

dimension_id: "holding_volume"
name: "持仓量状态"
entity: "user"
description: "用户持仓量的状态分类，用于过滤有效持仓记录"

aliases:
  - "持仓状态"
  - "volume"

# ── 计算属性 ─────────────────────────────────────────────────────────
named_values:
  - value_id: "holding_volume_positive"
    name: "有效持仓"
    description: "持仓量大于 0 的记录，排除已清仓或零持仓"
    sql_condition: "volume > 0"
    aliases:
      - "持仓量大于0"
      - "非零持仓"

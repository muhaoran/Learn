dimension_id: "user_computed_tags"
name: "用户计算标签"
entity: "user"
description: "需要通过 SQL 计算才能确定的用户状态标签，这些标签在业务上有独立命名和明确的口径"

aliases:
  - "用户标签"
  - "用户状态"

named_values:
  - value_id: "active_user"
    name: "活跃用户"
    description: "在指定日期有任意行为的用户"
    depends_on_events:
      - active_behavior
    sql_condition: >
      user_id IN (
        SELECT user_id
        FROM dwd_user_behavior
        WHERE date = ${target_date}
      )
    aliases:
      - "活跃"
      - "AU"
      - "有行为的用户"

  - value_id: "new_user"
    name: "新用户"
    description: "注册日期等于统计日期的用户（当日新增）"
    depends_on_events:
      - registration
    sql_condition: >
      user_id IN (
        SELECT user_id
        FROM dwd_user_register
        WHERE register_date = ${target_date}
      )
    aliases:
      - "新增用户"
      - "当日新用户"
      - "new user"

  - value_id: "old_user"
    name: "老用户"
    description: "注册日期早于统计日期的用户（非当日新增）"
    depends_on_events:
      - registration
    sql_condition: >
      user_id IN (
        SELECT user_id
        FROM dwd_user_register
        WHERE register_date < ${target_date}
      )
    aliases:
      - "存量用户"
      - "old user"

  - value_id: "retained_on_day_n"
    name: "注册后第 N 天活跃用户"
    description: "在 base_date 注册，并在注册后第 N 天（base_date + N）有活跃行为的用户"
    depends_on_events:
      - registration
      - active_behavior
    parameters:
      n:
        type: integer
        description: "注册后的第几天，如 n=1 即次日留存，n=7 即七日留存"
      base_date:
        type: date
        description: "注册的基准日期"
    sql_condition: >
      user_id IN (
        SELECT r.user_id
        FROM dwd_user_register r
        JOIN dwd_user_behavior b
          ON r.user_id = b.user_id
         AND b.date = date_add('day', ${n}, r.register_date)
        WHERE r.register_date = ${base_date}
      )
    aliases:
      - "D${n}留存"
      - "第${n}天留存"

  - value_id: "first_purchase_within_n_days"
    name: "注册后 N 天内首购用户"
    description: "在注册日期起 N 天内（含注册当天）完成首次交易的用户"
    depends_on_events:
      - registration
    parameters:
      n:
        type: integer
        description: "观察窗口天数，如 n=7 即注册后7天内首购"
    sql_condition: >
      user_id IN (
        SELECT r.user_id
        FROM dwd_user_register r
        JOIN dwd_trade_order o
          ON r.user_id = o.user_id
         AND o.order_date >= r.register_date
         AND o.order_date <= date_add('day', ${n}, r.register_date)
        WHERE o.is_first_order = true
      )
    aliases:
      - "${n}日首购"
      - "注册${n}天内购买"

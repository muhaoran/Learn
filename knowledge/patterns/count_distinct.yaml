pattern_id: "count_distinct"
name: "去重计数"
description: '统计满足条件的某类实体的去重数量，是各类"去重主体个数"指标的通用计算模式（固定日期 / 滚动窗口均可，滚动窗口通过 time_window.window_days 指定）'

parameters:
  entity:
    type: Entity
    required: true
    description: "统计哪类实体，决定 COUNT DISTINCT 使用哪个主键字段"

  event:
    type: Event
    required: true
    description: "通过行为事件限定统计范围，展开为 FROM 表 + WHERE type_condition"

  where_dimension_values:
    type: "list<{dimension_id: Dimension, value: string}>"
    required: false
    description: "按维度字段的具体值过滤，展开为 AND sql_expr = 'value'；如 [{dimension_id: <dimension_id>, value: '<value>'}]"

  where_named_values:
    type: "Dimension.NamedValue[]"
    required: false
    description: "按命名分群过滤，展开为 AND primary_key IN (sql_condition)；多个条件取交集（AND）"

  time_window:
    type: "date_expr | {end_date: date, window_days: integer}"
    required: true
    description: |
      时间范围，支持两种形态：
      - 固定窗口（date_expr）：直接写 SQL 条件嵌入 WHERE，如 date = '2024-01-01'
      - 滚动窗口（{end_date, window_days}）：展开为 date > date_add('day', -window_days, DATE 'end_date') AND date <= DATE 'end_date'

  group_by:
    type: "Dimension[]"
    required: false
    description: "分组维度；有 sql_expr 的展开为字段直接分组，有 named_values 的展开为 CASE WHEN 分组列"

sql_template: |
  SELECT
    ${group_by.expr, ...}
    COUNT(DISTINCT ${entity.primary_key}) AS cnt
  FROM ${event.source_table}
  ${LEFT JOIN dim.source_table ON dim.join_key}             -- group_by / where_dimension_values 需要时展开
  WHERE ${time_window}
    ${AND event.type_condition}
    ${AND where_dimension_values.sql_expr = value, ...}
    ${AND where_named_values.sql_condition, ...}
  ${GROUP BY group_by.expr, ...}

example_usage:
  # ── 占位示例（说明展开规则；实际使用时把 <event_table>/<entity_pk> 替换为真实表/字段） ──
  - description: "占位骨架：固定窗口 + 单事件"
    parameters:
      entity: "<entity_id>"                # → primary_key = <entity_pk>
      event:  "<event_id>"                 # → FROM <event_table> [WHERE <type_condition>]
      time_window: "<partition_field> = '<date>'"
    generated_sql: |
      SELECT
        COUNT(DISTINCT <entity_pk>) AS cnt
      FROM <event_table>
      WHERE <partition_field> = '<date>'
        [AND <event.type_condition>]

  - description: "占位骨架：滚动窗口"
    parameters:
      entity: "<entity_id>"
      event:  "<event_id>"
      time_window:
        end_date: "<end_date>"
        window_days: 30
    generated_sql: |
      SELECT
        COUNT(DISTINCT <entity_pk>) AS cnt
      FROM <event_table>
      WHERE <partition_field> > date_add('day', -30, DATE '<end_date>')
        AND <partition_field> <= DATE '<end_date>'
        [AND <event.type_condition>]

  # ── 真实业务表示例（基于 fundx_dwd.dwd_evt_parent_money_order_s） ─────
  - description: "统计某天发生公募主动买入的去重用户数"
    parameters:
      entity: "user"                                            # primary_key = uid
      event:  "fund_purchase"                                   # → FROM dwd_evt_parent_money_order_s WHERE is_private=0 AND trade_mode IN (1,2,3,4,5)
      time_window: "dt = '2024-01-01'"
    generated_sql: |
      SELECT
        COUNT(DISTINCT uid) AS cnt
      FROM fundx_dwd.dwd_evt_parent_money_order_s
      WHERE dt = '2024-01-01'
        AND is_private = 0
        AND trade_mode IN (1,2,3,4,5)

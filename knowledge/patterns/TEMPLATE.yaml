# 计算模式（Pattern）定义模板

pattern_id: "your_pattern_id"      # 英文标识，全小写下划线
name: "中文名"
description: "这个模式解决什么计算问题，一句话说清楚"

parameters:
  entity:
    type: Entity
    required: false   # 按 pattern 需要设置：count_distinct 必填，sum_metric 快照型必填，其他可选
    description: "统计主体实体；count_distinct 用其 primary_key 做去重，sum_metric 快照型用其 anchor_tables 定位来源表"

  event:
    type: Event
    required: false
    description: "通过行为事件限定统计范围，展开为 FROM 表 + WHERE type_condition"

  where_dimension_values:
    type: "list<{dimension_id: Dimension, value: string}>"
    required: false
    description: "按维度字段的具体值过滤，展开为 WHERE sql_expr = 'value'；如 [{dimension_id: user_platform, value: 'iOS'}]"

  where_named_values:
    type: "Dimension.NamedValue[]"
    required: false
    description: "按命名分群过滤，展开为 AND primary_key IN (sql_condition)；多个条件取交集（AND）"

  time_window:
    type: "date_expr | {end_date: date, window_days: integer}"
    required: true
    description: |
      时间范围，支持两种形态：
      - 固定窗口（date_expr）：直接写 SQL 条件嵌入 WHERE，如 date = '2024-01-01'
      - 滚动窗口（{end_date, window_days}）：展开为 date > date_add('day', -window_days, DATE 'end_date') AND date <= DATE 'end_date'

  group_by:
    type: "Dimension[]"
    required: false
    description: "分组维度；有 sql_expr 的展开为字段直接分组，有 named_values 的展开为 CASE WHEN 分组列"

# SQL 模板：${参数名.属性} 引用上面的参数，具体展开效果见 example_usage
sql_template: |
  SELECT
    ${group_by},                                    -- 如 register_channel（无 group_by 时省略）
    COUNT(DISTINCT ${entity.primary_key}) AS cnt    -- 如 COUNT(DISTINCT user_id)
  FROM ${event.source_table}                        -- 如 FROM dwd_user_behavior
  LEFT JOIN ${dimension.source_table} ON ${dimension.join_key}
                                                      -- 分组或过滤用到的字段不在主表中时，JOIN 该维度定义的 source_table
                                                      -- 如 LEFT JOIN dwd_user_register ON user_id = user_id
  WHERE ${event.type_condition}                     -- 如 behavior_type = 'create_post'（无则省略）
    AND ${where_dimension_values}                   -- 如 AND platform = 'iOS'
    AND ${where_named_values}                       -- 如 AND user_id IN (SELECT ...)
    AND ${time_window}                              -- 如 date = '2024-01-01'
  GROUP BY ${group_by}                              -- 无 group_by 时省略

example_usage:
  description: "统计某天 iOS 平台上发帖的新用户数，按注册渠道分组"
  parameters:
    entity: user                                            # Entity → primary_key = user_id
    event: post_publish                                     # Event → FROM dwd_user_behavior WHERE behavior_type = 'create_post'
    where_dimension_values:
      - dimension_id: user_platform                         # Dimension → AND platform = 'iOS'（需 JOIN dwd_user_behavior 已有该字段）
        value: "iOS"
    where_named_values:
      - new_user                                            # Dimension.NamedValue → AND user_id IN (SELECT ... FROM dwd_user_register)
    time_window: "date = '2024-01-01'"                      # date_expr → 直接嵌入 WHERE
    group_by: ["user_register_channel"]                     # Dimension[] → JOIN dwd_user_register，SELECT + GROUP BY register_channel
  generated_sql: |
    SELECT
      r.register_channel,
      COUNT(DISTINCT b.user_id) AS cnt
    FROM dwd_user_behavior b
    JOIN dwd_user_register r ON b.user_id = r.user_id
    WHERE b.behavior_type = 'create_post'
      AND b.platform = 'iOS'
      AND b.date = '2024-01-01'
      AND b.user_id IN (
        SELECT user_id
        FROM dwd_user_register
        WHERE register_date = '2024-01-01'
      )
    GROUP BY r.register_channel

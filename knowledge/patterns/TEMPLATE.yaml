# 计算模式（Pattern）定义模板

pattern_id: "<pattern_id>"          # 英文标识，全小写下划线
name: "<中文名>"
description: "<这个模式解决什么计算问题，一句话说清楚>"

parameters:
  entity:
    type: Entity
    required: false   # 按 pattern 需要设置：count_distinct 必填，sum_metric 快照型必填，其他可选
    description: "统计主体实体；count_distinct 用其 primary_key 做去重，sum_metric 快照型用其 anchor_tables 定位来源表"

  event:
    type: Event
    required: false
    description: "通过行为事件限定统计范围，展开为 FROM 表 + WHERE type_condition"

  where_dimension_values:
    type: "list<{dimension_id: Dimension, value: string}>"
    required: false
    description: "按维度字段的具体值过滤，展开为 WHERE sql_expr = 'value'；如 [{dimension_id: <dimension_id>, value: '<value>'}]"

  where_named_values:
    type: "Dimension.NamedValue[]"
    required: false
    description: "按命名分群过滤，展开为 AND primary_key IN (sql_condition)；多个条件取交集（AND）"

  time_window:
    type: "date_expr | {end_date: date, window_days: integer}"
    required: true
    description: |
      时间范围，支持两种形态：
      - 固定窗口（date_expr）：直接写 SQL 条件嵌入 WHERE，如 date = '2024-01-01'
      - 滚动窗口（{end_date, window_days}）：展开为 date > date_add('day', -window_days, DATE 'end_date') AND date <= DATE 'end_date'

  group_by:
    type: "Dimension[]"
    required: false
    description: "分组维度；有 sql_expr 的展开为字段直接分组，有 named_values 的展开为 CASE WHEN 分组列"

# SQL 模板：${参数名.属性} 引用上面的参数，具体展开效果见 example_usage
sql_template: |
  SELECT
    ${group_by.expr, ...}                                 -- 无 group_by 时省略
    COUNT(DISTINCT ${entity.primary_key}) AS <metric_alias>
  FROM ${event.source_table}
  ${LEFT JOIN dim.source_table ON dim.join_key}           -- group_by / where_dimension_values 字段不在主表时展开
  WHERE ${time_window}                                    -- 必填
    ${AND event.type_condition}                           -- 如有
    ${AND where_dimension_values.sql_expr = value, ...}   -- 如有
    ${AND where_named_values.sql_condition, ...}          -- 如有
  ${GROUP BY group_by.expr, ...}                          -- 无 group_by 时省略

example_usage:
  # ── 占位骨架（说明展开规则；实际使用时把 <...> 占位替换为真实实体/事件/维度/表/字段） ──
  description: "占位骨架：按 <维度> 分组的 <count_distinct 类指标>"
  parameters:
    entity: "<entity_id>"                                 # → primary_key = <entity_pk>
    event:  "<event_id>"                                  # → FROM <event_table> [WHERE <event.type_condition>]
    where_dimension_values:
      - dimension_id: <dimension_id>                      # → AND <dim_field> = '<value>'
        value: "<value>"
    where_named_values:
      - <named_value_id>                                  # → AND <entity_pk> IN (SELECT ... <sql_condition>)
    time_window: "<partition_field> = '<date>'"
    group_by: ["<dimension_id>"]                          # → SELECT + GROUP BY <dim_expr>（必要时 JOIN <dim_source_table>）
  generated_sql: |
    SELECT
      <dim_expr>,
      COUNT(DISTINCT <entity_pk>) AS <metric_alias>
    FROM <event_table>
    [JOIN <dim_source_table> ON <join_condition>]
    WHERE <partition_field> = '<date>'
      [AND <event.type_condition>]
      [AND <dim_field> = '<value>']
      [AND <entity_pk> IN (SELECT ... <named_value.sql_condition>)]
    GROUP BY <dim_expr>

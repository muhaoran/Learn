table_id: "dim_pat_xq_dj_single_mapping_manual"
name: "雪球-蛋卷用户手工映射维表（1:1）"
full_name: "fundx_dim.dim_pat_xq_dj_single_mapping_manual"
layer: DIM
description: "人工维护的雪球用户（xq_uid）与蛋卷用户（dj_uid）的唯一一一对应关系，用于需要强关系场景下的 ID 对齐"

storage:
  partition_field: "dt"
  update_frequency: "按需"
  data_range: "历史全量"
  retention: "永久保留"

primary_key:
  - dt
  - xq_uid
  - dj_uid

columns:
  - name: "dt"
    type: "date"
    description: "分区日期（手工维护的映射快照日期）"
    nullable: false
    is_partition: true
    example: "2022-08-25"

  - name: "xq_uid"
    type: "bigint"
    description: "雪球用户 ID"
    nullable: true
    is_partition: false

  - name: "uid"
    type: "bigint"
    description: "蛋卷用户 ID（dj_uid），原始字段名为 uid，使用时通常别名为 dj_uid"
    nullable: true
    is_partition: false

notes:
  - "1:1 强关系：一条记录对应一对 (xq_uid, dj_uid)。多对多关系请使用 fundx_dwd.dwd_pat_xq_dj_uidjoin_s。"
  - "查询时必须加 dt 分区条件；业务示例使用 dt='2022-08-25'，新查询需根据最新分区选择。"
  - "原始字段名为 uid，需通过 SELECT uid AS dj_uid 映射到规范化的 dj_uid 名称。"

related_tables:
  - table: "fundx_dwd.dwd_pat_xq_dj_uidjoin_s"
    join_field: "xq_uid / dj_uid"
    join_type: "1:N"
    purpose: "1:1 强关系的补充，N:N 场景下使用 uidjoin 表"
  - table: "xq_ods.ods_usnowball_oauthuser_s_trans"
    join_field: "xq_uid / dj_uid"
    join_type: "1:1"
    purpose: "通过 UC 系统（source='dj'）获取的自动化 1:1 映射，两者互为补充"

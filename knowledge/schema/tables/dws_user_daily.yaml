table_id: "dws_user_daily"
name: "用户日度汇总表"
layer: DWS
description: "按日期和用户聚合的汇总表，记录每个用户每天的活跃情况和核心行为指标，是 DAU/新增/留存等高频指标的首选查询表"

storage:
  partition_field: "date"
  update_frequency: "T+1（每天凌晨更新前一天数据）"
  data_range: "2020-01-01 至今"
  row_estimate: "日增约 100 万行"
  retention: "保留最近 2 年"

primary_key:
  - date
  - user_id

columns:
  - name: "date"
    type: "date"
    description: "统计日期，同时也是分区字段"
    nullable: false
    is_partition: true
    example: "2024-01-01"

  - name: "user_id"
    type: "bigint"
    description: "用户 ID"
    nullable: false
    is_partition: false
    example: "123456"

  - name: "is_active"
    type: "int"
    description: "当日是否活跃（有任意行为记录）"
    nullable: false
    is_partition: false
    example: "1"
    enum_values:
      - value: "1"
        description: "活跃"
      - value: "0"
        description: "不活跃（当天无任何行为）"

  - name: "is_new_user"
    type: "int"
    description: "当日是否为新注册用户"
    nullable: false
    is_partition: false
    example: "0"
    enum_values:
      - value: "1"
        description: "当日新注册用户"
      - value: "0"
        description: "非新增用户"

  - name: "register_date"
    type: "date"
    description: "该用户的注册日期（所有用户都有，不只是新增用户）"
    nullable: true
    is_partition: false
    example: "2024-01-01"

  - name: "register_channel"
    type: "varchar(50)"
    description: "该用户的注册渠道（冗余字段，避免 JOIN dwd_user_register）"
    nullable: true
    is_partition: false
    example: "app_store"

  - name: "platform"
    type: "varchar(20)"
    description: "当日主要使用的平台（多平台时取行为次数最多的平台）"
    nullable: true
    is_partition: false
    example: "iOS"

  - name: "behavior_count"
    type: "int"
    description: "当日总行为次数（所有 behavior_type 的合计）"
    nullable: false
    is_partition: false
    example: "25"

  - name: "post_count"
    type: "int"
    description: "当日发帖数（behavior_type = 'create_post'）"
    nullable: false
    is_partition: false
    example: "3"

  - name: "comment_count"
    type: "int"
    description: "当日评论数（behavior_type = 'create_comment'）"
    nullable: false
    is_partition: false
    example: "10"

  - name: "like_count"
    type: "int"
    description: "当日点赞数（behavior_type = 'like'）"
    nullable: false
    is_partition: false
    example: "12"

  - name: "duration_seconds"
    type: "int"
    description: "当日 App 使用时长（秒）"
    nullable: false
    is_partition: false
    example: "3600"

notes:
  - "⚠️ T+1 更新，当天数据查询结果为空或不完整，请查询昨天及以前"
  - "⚠️ 必须加 date 分区条件"
  - "统计 DAU 时，使用 is_active = 1 过滤"
  - "统计新增用户时，使用 is_new_user = 1 过滤"
  - "优先使用本表，避免直接查询 dwd_user_behavior（性能差）"

related_tables:
  - table: "dim_user"
    join_field: "user_id"
    join_type: "N:1"
    purpose: "获取用户属性（如等级、认证状态）"
  - table: "dwd_user_register"
    join_field: "user_id"
    join_type: "N:1"
    purpose: "获取注册详情（register_channel 已冗余，一般不需要）"

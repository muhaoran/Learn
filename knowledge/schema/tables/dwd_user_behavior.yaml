table_id: "dwd_user_behavior"
name: "用户行为明细表"
layer: DWD
description: "记录所有用户行为的明细数据，包括浏览、发帖、评论、点赞、交易等"

storage:
  partition_field: "date"
  update_frequency: "实时（延迟 5-10 分钟）"
  data_range: "2020-01-01 至今"
  row_estimate: "日增约 5000 万行"
  retention: "保留最近 90 天明细，更早数据已归档到汇总表"

primary_key:
  - behavior_id

columns:
  - name: "behavior_id"
    type: "bigint"
    description: "行为记录唯一标识"
    nullable: false
    is_partition: false
    example: "123456789"

  - name: "user_id"
    type: "bigint"
    description: "产生行为的用户 ID"
    nullable: false
    is_partition: false
    example: "123456"

  - name: "behavior_type"
    type: "varchar(50)"
    description: "行为类型，决定了这条记录的业务含义"
    nullable: false
    is_partition: false
    example: "view_post"
    enum_values:
      - value: "login"
        description: "用户登录"
      - value: "view_post"
        description: "浏览帖子详情"
      - value: "view_feed"
        description: "浏览信息流"
      - value: "create_post"
        description: "发布帖子"
      - value: "create_comment"
        description: "发布评论"
      - value: "like"
        description: "点赞"
      - value: "favorite"
        description: "收藏"
      - value: "share"
        description: "分享"
      - value: "follow"
        description: "关注其他用户"
      - value: "trade"
        description: "发起交易"

  - name: "behavior_time"
    type: "timestamp"
    description: "行为发生的精确时间"
    nullable: false
    is_partition: false
    example: "2024-01-01 12:30:45"

  - name: "date"
    type: "date"
    description: "行为发生日期，同时也是分区字段"
    nullable: false
    is_partition: true
    example: "2024-01-01"

  - name: "platform"
    type: "varchar(20)"
    description: "行为发生时使用的平台"
    nullable: false
    is_partition: false
    example: "iOS"
    enum_values:
      - value: "iOS"
        description: "苹果 iOS 客户端"
      - value: "Android"
        description: "安卓客户端"
      - value: "Web"
        description: "PC 网页端"
      - value: "H5"
        description: "移动 H5 网页"

  - name: "object_id"
    type: "bigint"
    description: "行为对象的 ID（如帖子 ID、评论 ID），无对象行为（如登录）时为 NULL"
    nullable: true
    is_partition: false
    example: "789012"

  - name: "object_type"
    type: "varchar(50)"
    description: "行为对象的类型，与 object_id 配合使用"
    nullable: true
    is_partition: false
    example: "post"
    enum_values:
      - value: "post"
        description: "帖子"
      - value: "comment"
        description: "评论"
      - value: "user"
        description: "用户（如关注行为的对象）"

  - name: "channel"
    type: "varchar(50)"
    description: "用户从哪个入口进入（用于漏斗分析）"
    nullable: true
    is_partition: false
    example: "feed"

  - name: "session_id"
    type: "varchar(100)"
    description: "会话 ID，同一次打开 App 的行为归属同一 session"
    nullable: true
    is_partition: false
    example: "sess_abc123"

notes:
  - "⚠️ 必须加 date 分区条件，否则全表扫描会超时"
  - "⚠️ 数据量极大（日增5千万），尽量使用汇总表 dws_user_daily 代替"
  - "⚠️ 实时数据有 5-10 分钟延迟，当天数据可能不完整"
  - "⚠️ 查询多天数据时，建议限制在 30 天以内"
  - "同一用户在同一天会有多条记录（不同行为），COUNT 前必须去重"

related_tables:
  - table: "dim_user"
    join_field: "user_id"
    join_type: "N:1"
    purpose: "获取用户属性（注册渠道、用户等级等）"
  - table: "dwd_post"
    join_field: "object_id（当 object_type='post'）"
    join_type: "N:1"
    purpose: "获取帖子详情（如帖子类型、标题）"
  - table: "dwd_comment"
    join_field: "object_id（当 object_type='comment'）"
    join_type: "N:1"
    purpose: "获取评论详情"

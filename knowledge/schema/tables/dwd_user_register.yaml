table_id: "dwd_user_register"
name: "用户注册明细表"
layer: DWD
description: "记录每个用户的首次注册信息，一个用户只有一条记录"

storage:
  partition_field: "register_date"
  update_frequency: "实时"
  data_range: "2015-01-01 至今"
  row_estimate: "日增约 5 万行"
  retention: "永久保留"

primary_key:
  - user_id

columns:
  - name: "user_id"
    type: "bigint"
    description: "用户唯一标识"
    nullable: false
    is_partition: false
    example: "123456"

  - name: "register_time"
    type: "timestamp"
    description: "注册完成时间"
    nullable: false
    is_partition: false
    example: "2024-01-01 12:30:45"

  - name: "register_date"
    type: "date"
    description: "注册日期，同时也是分区字段"
    nullable: false
    is_partition: true
    example: "2024-01-01"

  - name: "register_channel"
    type: "varchar(50)"
    description: "注册来源渠道"
    nullable: false
    is_partition: false
    example: "app_store"
    enum_values:
      - value: "app_store"
        description: "iOS App Store"
      - value: "android_market"
        description: "安卓应用市场（华为/小米/OPPO等）"
      - value: "ad_baidu"
        description: "百度广告投放"
      - value: "ad_tencent"
        description: "腾讯广告投放"
      - value: "organic"
        description: "自然流量（搜索、口碑传播等）"
      - value: "invite"
        description: "用户邀请注册"

  - name: "register_platform"
    type: "varchar(20)"
    description: "注册时使用的平台"
    nullable: false
    is_partition: false
    example: "iOS"
    enum_values:
      - value: "iOS"
        description: "苹果 iOS 客户端"
      - value: "Android"
        description: "安卓客户端"
      - value: "Web"
        description: "PC 网页端"

  - name: "device_id"
    type: "varchar(100)"
    description: "注册设备唯一标识"
    nullable: true
    is_partition: false
    example: "abc123def456"

  - name: "province"
    type: "varchar(50)"
    description: "注册时的省份（基于 IP 推断）"
    nullable: true
    is_partition: false
    example: "北京"

  - name: "city"
    type: "varchar(50)"
    description: "注册时的城市（基于 IP 推断）"
    nullable: true
    is_partition: false
    example: "北京市"

  - name: "invite_user_id"
    type: "bigint"
    description: "邀请人的 user_id，非邀请注册时为 NULL"
    nullable: true
    is_partition: false
    example: "789012"

notes:
  - "一个用户只有一条记录（首次注册），没有更新"
  - "查询时建议加 register_date 分区条件"
  - "注销后重新注册的用户会有新的 user_id"

related_tables:
  - table: "dim_user"
    join_field: "user_id"
    join_type: "1:1"
    purpose: "获取用户当前属性（如昵称、等级）"
  - table: "dws_user_daily"
    join_field: "user_id"
    join_type: "1:N"
    purpose: "获取注册后各天的活跃情况（用于留存分析）"
  - table: "dwd_user_behavior"
    join_field: "user_id"
    join_type: "1:N"
    purpose: "获取注册后的行为明细"
